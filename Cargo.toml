[package]
name = "castellan"
version = "0.1.0-dev"
authors = ["Arad Fadaei <arad@fadaei.dev>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
tokio = { version = "1.50.0", features = ["full"], optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["std", "env-filter", "fmt", "json"] }
tracing-appender = "0.2.4"
tracing-futures = "0.2.5"
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.42"



[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "dep:tokio"]
# web = ["dioxus/web"]
# mobile = ["dioxus/mobile"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
